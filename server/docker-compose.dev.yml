# Local Postgres for development and tests: docker compose -f docker-compose.dev.yml up -d
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: buysun
      POSTGRES_USER: buysun
      POSTGRES_PASSWORD: buysun
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - buysun_dev_db17:/var/lib/postgresql/data

volumes:
  buysun_dev_db17:
